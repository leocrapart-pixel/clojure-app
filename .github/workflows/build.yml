name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          java -version
          clojure --version
          flutter --version

      # Generate the Android host project for the installed Flutter version,
      # so the Gradle/AGP/Kotlin versions always match the SDK on the runner.
      - name: Generate Android host project
        run: |
          flutter create --platforms=android --project-name clojure_app --org com.leocrapart .
          # The generated scaffold ships a widget_test.dart for its own demo app;
          # this project has its own tests and no MyApp class.
          rm -f test/widget_test.dart

      - name: Compile ClojureDart to Dart
        run: |
          set +e
          status=0
          for ns in clojure-app.theme clojure-app.astro clojure-app.cycle clojure-app.ui clojure-app.main; do
            echo "::group::compile $ns"
            clojure -M:cljd compile "$ns"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::compile failed for $ns"
              status=1
            fi
          done
          exit "$status"

      - name: Run astronomy tests
        run: flutter test

      - name: Inspect compiled output
        run: |
          echo "compiled dart entry points:"
          find lib -name '*.dart' | head -20

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clojure-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Flutter web
        run: flutter build web --release --base-href "/clojure-app/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
